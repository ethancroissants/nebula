[workspace]
resolver = "2"
members = ["crates/nebula-core", "crates/nebula-hook", "crates/nebula"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Nebula contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
