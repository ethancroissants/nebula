name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --workspace

      - name: Create release bundle
        run: |
          mkdir -p dist/nebula-linux-x86_64
          cp target/release/nebula dist/nebula-linux-x86_64/
          cp target/release/libnebula_hook.so dist/nebula-linux-x86_64/
          cp nebula-attach dist/nebula-linux-x86_64/
          strip -s dist/nebula-linux-x86_64/nebula dist/nebula-linux-x86_64/libnebula_hook.so 2>/dev/null || true
          tar -czf dist/nebula-linux-x86_64.tar.gz -C dist nebula-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nebula-linux-x86_64.tar.gz
          generate_release_notes: true
