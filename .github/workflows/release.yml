name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.4.2)'
        required: true
        default: ''

# The default GITHUB_TOKEN needs explicit write access to create a release
# and upload the tarball as an asset.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust hook
        run: cargo build --release --workspace

      - name: Install npm dependencies
        run: npm ci

      - name: Package Electron app
        run: npm run package

      - name: Create release bundle
        run: |
          mkdir -p dist/nebula-linux-x86_64
          cp -r Nebula-linux-x64/* dist/nebula-linux-x86_64/
          # Include the Rust-built hook alongside the Electron app
          mkdir -p dist/nebula-linux-x86_64/hook
          cp target/release/libnebula_hook.so dist/nebula-linux-x86_64/hook/
          cp target/release/nebula-inject dist/nebula-linux-x86_64/hook/
          cp nebula-attach dist/nebula-linux-x86_64/hook/
          tar -czf dist/nebula-linux-x86_64.tar.gz -C dist nebula-linux-x86_64

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # workflow_dispatch carries no tag ref — fall back to the input
          # (the checkout step pins the tag via ref: below).
          if [ "$TAG" = "refs/heads" ] || [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          [ -n "$TAG" ] || { echo "::error::No tag specified"; exit 1; }
          echo "Releasing tag: $TAG"
          echo "Creating release for tag $TAG"

          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$GITHUB_REPOSITORY/releases \
            -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"Release $TAG\",\"body\":\"Release $TAG\",\"draft\":false,\"prerelease\":false}" \
            | jq -r .id)

          echo "Release ID: $RELEASE_ID"

          if [ "$RELEASE_ID" = "null" ] || [ -z "$RELEASE_ID" ]; then
            echo "::error::Failed to create release"
            exit 1
          fi

          # Upload the tarball as an asset
          HTTP_CODE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/gzip" \
            https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename dist/nebula-linux-x86_64.tar.gz) \
            -H "Accept: application/vnd.github+json" \
            --data-binary @dist/nebula-linux-x86_64.tar.gz \
            -o /dev/null -w "%{http_code}")

          echo "Upload status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Failed to upload asset (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "Release created successfully"