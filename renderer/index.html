<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula — for Sober</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#4f46e5" stroke-width="1.8"/>
          <ellipse cx="12" cy="12" rx="10" ry="4" stroke="#4f46e5" stroke-width="1.4" transform="rotate(-24 12 12)"/>
          <circle cx="12" cy="12" r="2.6" fill="#4f46e5"/>
        </svg>
        <h1>Nebula</h1>
        <span class="subtitle">for Sober</span>
      </div>
      <div class="status-pill-row">
        <div id="hook-pill" class="status-pill idle">
          <span class="pulse-dot"></span><span id="hook-pill-label">Idle</span>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section class="panel launch-panel">
        <div class="launch-row">
          <button id="btn-launch-inject" class="launch-btn">
            <svg class="launch-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M5 3.5v17l14-8.5L5 3.5z" fill="currentColor"/>
            </svg>
            <span class="launch-label">Launch &amp; Inject</span>
            <span class="launch-spinner"></span>
          </button>
          <button id="btn-stop-sober" class="icon-btn" title="Stop Sober">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
        </div>
        <div class="progress-wrap">
          <div id="launch-progress" class="progress-bar"></div>
        </div>
        <div id="launch-stage" class="launch-stage">Ready</div>

        <div class="status-grid">
          <div class="status-item">
            <label>Sober</label>
            <span id="sober-status" class="status-indicator idle">Checking…</span>
          </div>
          <div class="status-item">
            <label>Override</label>
            <span id="override-status" class="status-value">—</span>
          </div>
          <div class="status-item">
            <label>Processes</label>
            <span id="process-count" class="status-value">0</span>
          </div>
          <div class="status-item">
            <label>Hook</label>
            <span id="hook-status" class="status-indicator idle">Idle</span>
          </div>
        </div>

        <div class="button-group">
          <button id="btn-check-sober" class="btn btn-ghost">Check Sober</button>
          <button id="btn-install-sober" class="btn btn-ghost">Install Sober</button>
          <button id="btn-attach" class="btn btn-ghost">Apply Override Only</button>
          <label class="switch" title="Re-apply override automatically when launching">
            <input type="checkbox" id="cb-auto-attach">
            <span class="slider"></span>
            Auto-override
          </label>
          <label class="switch" title="Launch Sober with NO hook — for testing crashes">
            <input type="checkbox" id="cb-safe-mode">
            <span class="slider"></span>
            Safe mode (no hook)
          </label>
          <label class="switch" title="Fallback only: trace the live Sober and dlopen the hook into it. Sober detects being traced and TERMINATES. Never worked here; off by default.">
            <input type="checkbox" id="cb-allow-ptrace">
            <span class="slider"></span>
            Allow ptrace inject (unsafe)
          </label>
        </div>
      </section>

      <section class="panel console-panel">
        <div class="panel-head">
          <h2>Console</h2>
          <div class="panel-head-actions">
            <button id="btn-scroll-console" class="chip active">Auto-scroll</button>
            <button id="btn-save-console" class="chip">Save</button>
            <button id="btn-clear-console" class="chip">Clear</button>
          </div>
        </div>
        <div id="console-output" class="console-output"></div>
      </section>

      <section class="panel editor-panel">
        <div class="panel-head">
          <h2>Script Editor</h2>
          <div class="panel-head-actions">
            <select id="font-size-select" title="Font size">
              <option value="10">10px</option>
              <option value="11">11px</option>
              <option value="12">12px</option>
              <option value="13" selected>13px</option>
              <option value="14">14px</option>
              <option value="16">16px</option>
              <option value="18">18px</option>
            </select>
            <button id="btn-load" class="chip">Open…</button>
            <button id="btn-save" class="chip">Save…</button>
            <button id="btn-clear" class="chip">Clear</button>
            <button id="btn-execute" class="btn btn-primary execute-btn">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8L7 4z"/></svg>
              Execute <kbd>F5</kbd>
            </button>
          </div>
        </div>
        <div class="editor-wrapper">
          <textarea id="script-editor" spellcheck="false" placeholder="-- Write your Luau script here, then hit Execute (F5)"></textarea>
        </div>
        <div class="editor-footer">
          <span id="editor-status" class="editor-status">Ready</span>
          <span id="editor-stats" class="editor-stats">0 lines · 0 chars</span>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <div class="footer-links">
        <a href="https://github.com/ethancroissants/nebula" target="_blank">GitHub</a>
        <span class="dot">·</span>
        <a href="https://sober.vinegarhq.org" target="_blank">Sober</a>
        <span class="dot">·</span>
        <a href="https://flatpak.org" target="_blank">Flatpak</a>
      </div>
      <div class="footer-version">Nebula v0.1.0</div>
    </footer>
  </div>

  <script type="module" src="./index.js"></script>
</body>
</html>
