[package]
name = "nebula"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Nebula — a sleek script executor UI for Sober (Roblox on Linux)"
default-run = "nebula"

[[bin]]
name = "nebula"
path = "src/main.rs"

[dependencies]
nebula-core = { path = "../nebula-core" }
serde = { workspace = true }
serde_json = { workspace = true }
eframe = { version = "0.33", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "accesskit",
    "default_fonts",
] }
rfd = "0.15"
arboard = "3"
open = "5"
dirs = "6"
